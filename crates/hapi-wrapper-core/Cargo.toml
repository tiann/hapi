[package]
name = "hapi-wrapper-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.54", features = ["rt", "macros", "net", "time", "sync", "fs", "process"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"], default-features = false }
rustls = { version = "0.23", features = ["ring", "std", "tls12"], default-features = false }
rustls-native-certs = "0.8"
hyper = { version = "1.12", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
hyper-rustls = { version = "0.27", features = ["http1"], default-features = false }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
futures-util = { version = "0.3", features = ["sink", "std"], default-features = false }
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
sha2 = "0.11"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", features = ["signal", "hostname", "fs"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["test-util", "process", "io-util"] }
tokio-rustls = { version = "0.26", features = ["ring"], default-features = false }
proptest = "1.12"
tempfile = "3"
