<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HAPI</title>
  <script>
    (function () {
      var studio = window.location.pathname.match(/^\/studio\/([^/]+)/)
      if (studio) {
        var target = new URL('/studio.html', window.location.origin)
        target.search = window.location.search
        target.searchParams.set('token', studio[1])
        window.location.replace(target.toString())
        return
      }
      sessionStorage.setItem('spaRedirect', window.location.pathname + window.location.search + window.location.hash)
      window.location.replace('/')
    })()
  </script>
</head>
<body></body>
</html>
